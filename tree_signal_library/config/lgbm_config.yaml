# LightGBM 默认超参
regression:
  objective: regression       # regression | regression_l1 | huber | quantile
  metric: l2
  learning_rate: 0.03
  num_leaves: 64
  max_depth: -1
  min_data_in_leaf: 200
  feature_fraction: 0.7
  bagging_fraction: 0.7
  bagging_freq: 1
  lambda_l1: 0.1
  lambda_l2: 1.0
  min_gain_to_split: 0.0
  max_bin: 255
  num_boost_round: 5000
  early_stopping_rounds: 100
  verbosity: -1

ranking:
  objective: lambdarank       # lambdarank | rank_xendcg
  metric: ndcg
  ndcg_eval_at: [50, 100]
  learning_rate: 0.03
  num_leaves: 64
  max_depth: -1
  min_data_in_leaf: 200
  feature_fraction: 0.7
  bagging_fraction: 0.7
  bagging_freq: 1
  lambda_l1: 0.1
  lambda_l2: 1.0
  min_gain_to_split: 0.0
  max_bin: 255
  num_boost_round: 5000
  early_stopping_rounds: 100
  label_gain_max: 9           # ranking relevance 0..label_gain_max
  verbosity: -1
